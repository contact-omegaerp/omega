<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OMEGA – Quản lý bài viết</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root {
  --green:#00A651; --green-d:#007a3d; --red:#dc2626;
  --bg:#f3f4f6; --card:#fff; --border:#e5e7eb;
  --text:#1f2937; --muted:#6b7280; --sidebar-w:300px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;}

/* ── Auth ── */
#auth-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;}
.auth-box{background:var(--card);border-radius:16px;padding:40px;width:340px;box-shadow:0 8px 32px rgba(0,0,0,.10);text-align:center;}
.auth-logo{width:64px;margin-bottom:16px;}
.auth-box h2{font-size:20px;font-weight:700;margin-bottom:6px;}
.auth-box p{color:var(--muted);font-size:13px;margin-bottom:24px;}
.auth-box input{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;margin-bottom:12px;outline:none;transition:.2s;}
.auth-box input:focus{border-color:var(--green);}
.auth-err{color:var(--red);font-size:13px;margin-top:-6px;margin-bottom:10px;display:none;}

/* ── Layout ── */
#app{display:none;height:100vh;flex-direction:column;}
.top-bar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
.top-bar .brand{font-weight:700;font-size:15px;color:var(--green);margin-right:auto;}
.top-bar .brand span{color:var(--text);}
.main{display:flex;flex:1;overflow:hidden;}
.sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--card);border-right:1px solid var(--border);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;}
.editor-area{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px;}

/* ── Form controls ── */
label{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;}
input[type=text],input[type=date],select,textarea{width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;outline:none;transition:.15s;background:#fff;}
input:focus,select:focus,textarea:focus{border-color:var(--green);}
textarea{resize:vertical;}
.field{display:flex;flex-direction:column;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* ── Buttons ── */
.btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:600;transition:.15s;display:inline-flex;align-items:center;gap:6px;}
.btn:active{transform:scale(.97);}
.btn-green{background:var(--green);color:#fff;}
.btn-green:hover{background:var(--green-d);}
.btn-outline{background:#fff;border:1.5px solid var(--border);color:var(--text);}
.btn-outline:hover{border-color:var(--green);color:var(--green);}
.btn-red{background:#fee2e2;color:var(--red);border:1.5px solid #fca5a5;}
.btn-red:hover{background:#fecaca;}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

/* ── Cover image ── */
.cover-drop{border:2px dashed var(--border);border-radius:10px;padding:16px;text-align:center;cursor:pointer;transition:.2s;position:relative;min-height:90px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;}
.cover-drop:hover,.cover-drop.drag-over{border-color:var(--green);background:#f0fdf4;}
.cover-drop img{width:100%;border-radius:6px;display:none;}
.cover-drop .placeholder{pointer-events:none;}
.cover-drop input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.uploading-badge{font-size:11px;color:var(--green);font-weight:600;display:none;}

/* ── Editor toolbar ── */
.editor-card{background:var(--card);border-radius:12px;border:1px solid var(--border);overflow:hidden;}
.toolbar{display:flex;flex-wrap:wrap;gap:2px;padding:8px 10px;border-bottom:1px solid var(--border);background:#fafafa;}
.tb-btn{background:none;border:none;border-radius:5px;padding:5px 8px;cursor:pointer;font-size:13px;color:var(--text);transition:.1s;line-height:1;}
.tb-btn:hover{background:var(--border);}
.tb-btn.active{background:#dcfce7;color:var(--green);}
.tb-sep{width:1px;background:var(--border);margin:2px 4px;}
#title-input{width:100%;padding:14px 16px;font-size:22px;font-weight:700;border:none;border-bottom:1px solid var(--border);outline:none;font-family:inherit;color:var(--text);}
#title-input::placeholder{color:#d1d5db;}
#editor{min-height:400px;padding:16px;outline:none;font-size:15px;line-height:1.85;color:var(--text);}
#editor:empty::before{content:attr(data-placeholder);color:#d1d5db;pointer-events:none;}
#editor h2{font-size:20px;font-weight:700;margin:28px 0 10px;padding-left:12px;border-left:3px solid var(--green);}
#editor h3{font-size:17px;font-weight:700;margin:20px 0 8px;}
#editor p{margin-bottom:14px;}
#editor ul,#editor ol{padding-left:22px;margin-bottom:14px;}
#editor li{margin-bottom:4px;}
#editor a{color:var(--green);}
#editor blockquote{border-left:3px solid var(--green);padding-left:14px;color:var(--muted);margin:16px 0;}
#editor img{max-width:100%;border-radius:8px;margin:12px 0;display:block;}
#editor table{width:100%;border-collapse:collapse;margin:14px 0;}
#editor th,#editor td{border:1px solid var(--border);padding:8px 10px;}
#editor th{background:#f9fafb;font-weight:600;}

/* ── Article list ── */
.list-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;border:1px solid transparent;transition:.15s;}
.list-item:hover{background:#f0fdf4;border-color:#bbf7d0;}
.list-item.active{background:#dcfce7;border-color:var(--green);}
.list-item .li-title{font-weight:600;font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.list-item .li-date{font-size:11px;color:var(--muted);white-space:nowrap;}
.list-badge{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;background:#dcfce7;color:var(--green-d);}
.list-badge.draft{background:#fef9c3;color:#854d0e;}

/* ── Status / Toast ── */
#toast{position:fixed;bottom:24px;right:24px;background:#1f2937;color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:0 4px 20px rgba(0,0,0,.25);transform:translateY(80px);transition:.3s;z-index:999;display:flex;align-items:center;gap:8px;}
#toast.show{transform:translateY(0);}
#toast.success{background:#14532d;}
#toast.error{background:#7f1d1d;}

/* ── Tabs ── */
.tabs{display:flex;gap:4px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--card);}
.tab{padding:7px 14px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);transition:.15s;}
.tab:hover{color:var(--text);background:var(--bg);}
.tab.active{background:var(--green);color:#fff;}
.tab-panel{display:none;}
.tab-panel.active{display:flex;flex:1;overflow:hidden;}

/* ── Char counter ── */
.char-count{font-size:11px;color:var(--muted);text-align:right;margin-top:2px;}
.char-count.over{color:var(--red);}

/* ── Collapsible SEO ── */
.collapse-toggle{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:6px 0;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;border-top:1px solid var(--border);margin-top:4px;}
.collapse-toggle .arrow{transition:.2s;}
.collapse-toggle.open .arrow{transform:rotate(180deg);}
.collapse-body{display:none;padding-top:10px;display:flex;flex-direction:column;gap:10px;}
.collapse-body.hidden{display:none;}

/* ── Image in body ── */
.inline-img-input{display:flex;gap:6px;margin-top:4px;}

/* ── Gallery thumbnails ── */
.gal-thumb{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;border:1px solid var(--border);}
.gal-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.gal-thumb .gal-del{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:4px;width:18px;height:18px;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;}
.gal-thumb.cover-mark::after{content:'BÌA';position:absolute;bottom:2px;left:2px;background:var(--green);color:#fff;font-size:9px;font-weight:700;padding:1px 4px;border-radius:3px;}
.upload-err{color:var(--red);font-size:11px;margin-top:4px;display:none;}
</style>
</head>
<body>

<!-- ── Auth ── -->
<div id="auth-screen">
  <div class="auth-box">
    <img class="auth-logo" src="../../assets/logo-favicon/favicon.ico" alt="OMEGA">
    <h2>OMEGA CMS</h2>
    <p>Quản lý bài viết tin tức</p>
    <input type="password" id="pwd-input" placeholder="Mật khẩu admin" autocomplete="current-password">
    <div class="auth-err" id="auth-err">Sai mật khẩu, thử lại.</div>
    <button class="btn btn-green" style="width:100%;justify-content:center;" onclick="doLogin()">
      Đăng nhập
    </button>
  </div>
</div>

<!-- ── App ── -->
<div id="app">
  <div class="top-bar">
    <div class="brand">OMEGA <span>CMS</span></div>
    <button class="btn btn-green btn-sm" onclick="newArticle()">＋ Bài mới</button>
    <button class="btn btn-outline btn-sm" onclick="logout()">Đăng xuất</button>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('editor')">✏️ Soạn bài</div>
    <div class="tab" onclick="switchTab('list')">📋 Danh sách</div>
  </div>

  <!-- Editor tab -->
  <div class="tab-panel active" id="tab-editor">
    <div class="sidebar">

      <!-- Gallery ảnh (ảnh bìa + ảnh phụ = hero slider) -->
      <div class="field">
        <label>Ảnh bài viết <span style="font-weight:400;text-transform:none;letter-spacing:0;">(kéo thả, nhiều ảnh = slider)</span></label>
        <div id="gallery-grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:6px;"></div>
        <div class="cover-drop" id="cover-drop" style="min-height:70px;"
             ondragover="event.preventDefault();this.classList.add('drag-over')"
             ondragleave="this.classList.remove('drag-over')"
             ondrop="onGalleryDrop(event)">
          <input type="file" id="cover-file" accept="image/*" multiple onchange="onGallerySelect(event)">
          <div class="placeholder" style="gap:3px;">
            <div style="font-size:22px;color:#d1d5db;">🖼️</div>
            <div style="font-size:11px;color:var(--muted);">Kéo thả hoặc click — chọn nhiều ảnh</div>
            <div id="gallery-uploading" style="font-size:11px;color:var(--green);display:none;">⏳ Đang upload...</div>
          </div>
        </div>
        <input type="text" id="f-cover-image" placeholder="URL ảnh bìa (tự điền sau upload)" style="margin-top:6px;font-size:12px;" oninput="syncCoverFromUrl()">
        <input type="hidden" id="f-gallery-images">
      </div>

      <!-- Google Doc link (tự extract ID) -->
      <div class="field">
        <label>Google Docs (nội dung từ Doc)</label>
        <input type="text" id="f-doc-url" placeholder="Dán link Google Docs..." oninput="extractDocId(this.value)">
        <div style="font-size:11px;color:var(--muted);margin-top:3px;">Doc ID: <span id="f-doc-id-display" style="color:var(--green);font-family:monospace;">—</span></div>
        <input type="hidden" id="f-doc-id">
      </div>

      <!-- Category -->
      <div class="field">
        <label>Danh mục</label>
        <select id="f-category">
          <option value="chuyen-doi-so">Chuyển đổi số</option>
          <option value="erp-quan-tri">ERP – Quản trị</option>
          <option value="ke-toan-tai-chinh">Kế toán – Tài chính</option>
          <option value="su-kien">Sự kiện</option>
          <option value="tuyen-dung">Tuyển dụng</option>
        </select>
      </div>

      <!-- Date + Read time -->
      <div class="row2">
        <div class="field">
          <label>Ngày đăng</label>
          <input type="date" id="f-date">
        </div>
        <div class="field">
          <label>Thời gian đọc</label>
          <input type="text" id="f-read-time" placeholder="5 phút">
        </div>
      </div>

      <!-- Author -->
      <div class="field">
        <label>Tác giả</label>
        <input type="text" id="f-author" placeholder="OMEGA R&D">
      </div>

      <!-- Slug -->
      <div class="field">
        <label>Slug (URL)</label>
        <input type="text" id="f-slug" placeholder="ten-bai-viet" oninput="slugEdited=true">
        <div style="font-size:11px;color:var(--muted);margin-top:3px;" id="slug-preview"></div>
      </div>

      <!-- Tags -->
      <div class="field">
        <label>Tags (phân cách bằng dấu phẩy)</label>
        <input type="text" id="f-tags" placeholder="ERP, chuyển đổi số, ...">
      </div>

      <!-- Featured -->
      <div class="field" style="flex-direction:row;align-items:center;gap:8px;">
        <input type="checkbox" id="f-featured" style="width:auto;cursor:pointer;">
        <label for="f-featured" style="text-transform:none;letter-spacing:0;font-size:13px;cursor:pointer;margin:0;">Bài nổi bật</label>
      </div>

      <!-- Status -->
      <div class="field">
        <label>Trạng thái</label>
        <select id="f-status">
          <option value="published">✅ Đã đăng</option>
          <option value="draft">📝 Nháp</option>
        </select>
      </div>

      <!-- SEO collapsible -->
      <div>
        <div class="collapse-toggle" id="seo-toggle" onclick="toggleSeo()">
          SEO <span class="arrow">▾</span>
        </div>
        <div class="collapse-body hidden" id="seo-body">
          <div class="field">
            <label>SEO Title</label>
            <input type="text" id="f-seo-title" placeholder="Tự động lấy từ tiêu đề nếu bỏ trống">
          </div>
          <div class="field">
            <label>SEO Description</label>
            <textarea id="f-seo-desc" rows="3" placeholder="Tự động lấy từ excerpt nếu bỏ trống"></textarea>
            <div class="char-count" id="seo-desc-count">0 / 160</div>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:auto;padding-top:12px;border-top:1px solid var(--border);">
        <button class="btn btn-green" onclick="saveArticle('published')" id="btn-publish">🚀 Đăng bài</button>
        <button class="btn btn-outline" onclick="saveArticle('draft')" id="btn-draft">💾 Lưu nháp</button>
        <button class="btn btn-red btn-sm" onclick="deleteArticle()" id="btn-delete" style="display:none;">🗑️ Xóa bài</button>
      </div>

    </div><!-- /sidebar -->

    <div class="editor-area">
      <!-- Excerpt -->
      <div class="field">
        <label>Mô tả ngắn (excerpt)</label>
        <textarea id="f-excerpt" rows="2" placeholder="Mô tả ngắn xuất hiện ở trang danh sách và kết quả tìm kiếm..." oninput="countExcerpt()"></textarea>
        <div class="char-count" id="excerpt-count">0 / 200</div>
      </div>

      <!-- Main editor card -->
      <div class="editor-card">
        <!-- Toolbar -->
        <div class="toolbar">
          <button class="tb-btn" onclick="fmt('bold')" title="Bold"><b>B</b></button>
          <button class="tb-btn" onclick="fmt('italic')" title="Italic"><i>I</i></button>
          <button class="tb-btn" onclick="fmt('underline')" title="Underline"><u>U</u></button>
          <div class="tb-sep"></div>
          <button class="tb-btn" onclick="fmtBlock('h2')" title="Tiêu đề 2">H2</button>
          <button class="tb-btn" onclick="fmtBlock('h3')" title="Tiêu đề 3">H3</button>
          <button class="tb-btn" onclick="fmtBlock('p')" title="Đoạn văn">¶</button>
          <div class="tb-sep"></div>
          <button class="tb-btn" onclick="fmt('insertUnorderedList')" title="Danh sách không thứ tự">• List</button>
          <button class="tb-btn" onclick="fmt('insertOrderedList')" title="Danh sách có thứ tự">1. List</button>
          <button class="tb-btn" onclick="fmtBlock('blockquote')" title="Trích dẫn">" "</button>
          <div class="tb-sep"></div>
          <button class="tb-btn" onclick="insertLink()" title="Chèn link">🔗</button>
          <button class="tb-btn" onclick="showImgPanel()" title="Chèn ảnh vào bài">📷 Ảnh</button>
          <div class="tb-sep"></div>
          <button class="tb-btn" onclick="fmt('removeFormat')" title="Xóa định dạng" style="color:var(--muted);">Tx</button>
        </div>

        <!-- Image insert panel -->
        <div id="img-panel" style="display:none;padding:10px 12px;border-bottom:1px solid var(--border);background:#fafafa;">
          <label style="margin-bottom:6px;">Chèn ảnh vào nội dung</label>
          <div class="inline-img-input">
            <input type="file" id="inline-img-file" accept="image/*" style="font-size:12px;" onchange="uploadInlineImg()">
            <span style="font-size:12px;color:var(--muted);align-self:center;">hoặc</span>
            <input type="text" id="inline-img-url" placeholder="Dán URL ảnh..." style="flex:1;font-size:12px;">
            <button class="btn btn-outline btn-sm" onclick="insertImgFromUrl()">Chèn</button>
          </div>
          <div id="inline-img-status" style="font-size:11px;color:var(--green);margin-top:4px;display:none;"></div>
        </div>

        <!-- Title -->
        <input type="text" id="title-input" placeholder="Tiêu đề bài viết..."
               oninput="onTitleInput(this.value)">

        <!-- Body -->
        <div id="editor" contenteditable="true" data-placeholder="Soạn nội dung bài viết..."></div>
      </div>
    </div>
  </div><!-- /tab-editor -->

  <!-- List tab -->
  <div class="tab-panel" id="tab-list">
    <div style="flex:1;overflow-y:auto;padding:16px;">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
        <input type="text" id="list-search" placeholder="Tìm bài viết..." oninput="filterList()" style="max-width:280px;">
        <select id="list-cat" onchange="filterList()" style="width:auto;">
          <option value="">Tất cả danh mục</option>
          <option value="chuyen-doi-so">Chuyển đổi số</option>
          <option value="erp-quan-tri">ERP – Quản trị</option>
          <option value="ke-toan-tai-chinh">Kế toán – Tài chính</option>
          <option value="su-kien">Sự kiện</option>
          <option value="tuyen-dung">Tuyển dụng</option>
        </select>
        <button class="btn btn-outline btn-sm" onclick="loadArticleList()">🔄 Làm mới</button>
        <span id="list-count" style="font-size:12px;color:var(--muted);margin-left:auto;"></span>
      </div>
      <div id="article-list"><div style="color:var(--muted);text-align:center;padding:40px;">Đang tải...</div></div>
    </div>
  </div>

</div><!-- /app -->

<div id="toast">✅ Đã lưu thành công</div>

<script>
// ─────────────────────────────────────────────
// CONFIG — điền URL GAS sau khi deploy tin-tuc.gs
// ─────────────────────────────────────────────
var GAS_URL = 'https://script.google.com/macros/s/AKfycbzvIEorg14qtjjdBR_Wii9cd3lZevWFaOy0O_7XH4Vzfgb6ll7iACcZDEd-RbFk5Hou0g/exec'; // << Dán URL deploy của tin-tuc.gs vào đây

// ─────────────────────────────────────────────
var _pwd = '';
var slugEdited = false;
var _allArticles = [];
var _currentSlug = '';
var _gallery = []; // [{url, isUploading}]

// ── Auth ──────────────────────────────────────
async function doLogin() {
  const pwd = document.getElementById('pwd-input').value.trim();
  if (!pwd) return;
  const btn = event.target;
  btn.disabled = true; btn.textContent = 'Đang xác thực...';
  try {
    const r = await gasPost({ action: 'verify_password', password: pwd });
    if (r.success) {
      _pwd = pwd;
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
      document.getElementById('app').style.flexDirection = 'column';
      initApp();
    } else {
      document.getElementById('auth-err').style.display = 'block';
    }
  } catch(e) { showToast('Lỗi kết nối GAS: ' + e.message, 'error'); }
  btn.disabled = false; btn.textContent = 'Đăng nhập';
}

document.getElementById('pwd-input').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

function logout() {
  _pwd = '';
  location.reload();
}

// ── Init ──────────────────────────────────────
function initApp() {
  // Set default date to today
  const now = new Date();
  document.getElementById('f-date').value = now.toISOString().slice(0,10);
  document.getElementById('f-author').value = 'OMEGA R&D';
  document.getElementById('f-read-time').value = '5 phút';
  loadArticleList();
}

// ── Tabs ─────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab').forEach((t,i) => {
    const panels = ['editor','list'];
    t.classList.toggle('active', panels[i] === name);
  });
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  if (name === 'list') loadArticleList();
}

// ── New article ───────────────────────────────
function newArticle() {
  _currentSlug = '';
  slugEdited = false;
  document.getElementById('title-input').value = '';
  document.getElementById('editor').innerHTML = '';
  document.getElementById('f-excerpt').value = '';
  document.getElementById('f-slug').value = '';
  document.getElementById('f-tags').value = '';
  document.getElementById('f-doc-url').value = '';
  document.getElementById('f-doc-id').value = '';
  document.getElementById('f-doc-id-display').textContent = '—';
  resetGallery();
  document.getElementById('f-featured').checked = false;
  document.getElementById('f-seo-title').value = '';
  document.getElementById('f-seo-desc').value = '';
  document.getElementById('f-status').value = 'published';
  document.getElementById('f-category').value = 'chuyen-doi-so';
  document.getElementById('f-read-time').value = '5 phút';
  document.getElementById('f-author').value = 'OMEGA R&D';
  document.getElementById('f-date').value = new Date().toISOString().slice(0,10);
  document.getElementById('btn-delete').style.display = 'none';
  document.getElementById('slug-preview').textContent = '';
  switchTab('editor');
  document.getElementById('title-input').focus();
  countExcerpt();
}

// ── Title → slug auto-gen ─────────────────────
function onTitleInput(val) {
  if (!slugEdited) {
    const slug = toSlug(val);
    document.getElementById('f-slug').value = slug;
    document.getElementById('slug-preview').textContent = slug ? 'URL: /tin-tuc/' + slug + '.html' : '';
  }
}

function toSlug(str) {
  if (!str) return '';
  return str.normalize('NFD')
    .replace(/[̀-ͯ]/g,'')
    .replace(/[đĐ]/g,'d')
    .toLowerCase()
    .replace(/[^a-z0-9\s-]/g,'')
    .trim().replace(/\s+/g,'-').replace(/-+/g,'-')
    .slice(0, 80);
}

// ── Gallery images ────────────────────────────
function onGalleryDrop(e) {
  e.preventDefault();
  document.getElementById('cover-drop').classList.remove('drag-over');
  uploadGalleryFiles(Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/')));
}

function onGallerySelect(e) {
  uploadGalleryFiles(Array.from(e.target.files));
  e.target.value = ''; // reset để chọn lại cùng file
}

async function uploadGalleryFiles(files) {
  if (!files.length) return;
  const upEl = document.getElementById('gallery-uploading');
  upEl.style.display = 'block';
  for (const file of files) {
    if (file.size > 5 * 1024 * 1024) { showToast(file.name + ' vượt 5MB, bỏ qua', 'error'); continue; }
    upEl.textContent = '⏳ Đang upload ' + file.name + '...';
    try {
      const b64 = await fileToBase64(file);
      const r = await gasPost({ action: 'upload_image', password: _pwd, file_base64: b64, filename: file.name });
      if (!r.success) throw new Error(r.error || JSON.stringify(r));
      addGalleryUrl(r.url);
      showToast('✅ ' + file.name, 'success');
    } catch(err) {
      showToast('❌ Upload lỗi: ' + err.message, 'error');
      console.error('Upload error detail:', err);
    }
  }
  upEl.style.display = 'none';
}

function addGalleryUrl(url) {
  if (_gallery.includes(url)) return;
  _gallery.push(url);
  // Ảnh đầu tiên = ảnh bìa
  if (_gallery.length === 1) document.getElementById('f-cover-image').value = url;
  syncGalleryField();
  renderGalleryGrid();
}

function removeGalleryUrl(idx) {
  _gallery.splice(idx, 1);
  // Cập nhật cover nếu xóa ảnh đầu
  document.getElementById('f-cover-image').value = _gallery[0] || '';
  syncGalleryField();
  renderGalleryGrid();
}

function syncCoverFromUrl() {
  const url = document.getElementById('f-cover-image').value.trim();
  if (url && !_gallery.includes(url)) { _gallery.unshift(url); syncGalleryField(); renderGalleryGrid(); }
}

function syncGalleryField() {
  document.getElementById('f-gallery-images').value = _gallery.join(',');
}

function renderGalleryGrid() {
  const grid = document.getElementById('gallery-grid');
  grid.innerHTML = _gallery.map((url, i) =>
    `<div class="gal-thumb${i===0?' cover-mark':''}">
      <img src="${url}" onerror="this.style.opacity='.3'">
      <button class="gal-del" onclick="removeGalleryUrl(${i})" title="Xóa ảnh">✕</button>
    </div>`
  ).join('');
}

function resetGallery() {
  _gallery = [];
  document.getElementById('f-cover-image').value = '';
  document.getElementById('f-gallery-images').value = '';
  document.getElementById('gallery-grid').innerHTML = '';
}

// ── Google Docs URL → extract Doc ID ─────────
function extractDocId(url) {
  const m = url.match(/\/d\/([a-zA-Z0-9_-]{25,})/);
  const id = m ? m[1] : '';
  document.getElementById('f-doc-id').value = id;
  document.getElementById('f-doc-id-display').textContent = id || '—';
}

// ── Inline image in body ──────────────────────
function showImgPanel() {
  const p = document.getElementById('img-panel');
  p.style.display = p.style.display === 'none' ? 'block' : 'none';
}

async function uploadInlineImg() {
  const file = document.getElementById('inline-img-file').files[0];
  if (!file) return;
  const status = document.getElementById('inline-img-status');
  status.style.display = 'block';
  status.textContent = '⏳ Đang upload...';
  try {
    const b64 = await fileToBase64(file);
    const r = await gasPost({ action: 'upload_image', password: _pwd, file_base64: b64, filename: file.name });
    if (!r.success) throw new Error(r.error || JSON.stringify(r));
    document.getElementById('inline-img-url').value = r.url;
    status.textContent = '✅ Upload xong – bấm Chèn để thêm vào bài';
  } catch(err) {
    status.textContent = '❌ ' + err.message;
    console.error('Inline upload error:', err);
  }
}

function insertImgFromUrl() {
  const url = document.getElementById('inline-img-url').value.trim();
  if (!url) return;
  document.getElementById('editor').focus();
  document.execCommand('insertHTML', false, '<img src="' + url + '" alt="" style="max-width:100%;border-radius:8px;margin:12px 0;">');
  document.getElementById('inline-img-url').value = '';
  document.getElementById('img-panel').style.display = 'none';
  document.getElementById('inline-img-status').style.display = 'none';
}

// ── Rich text editor ──────────────────────────
function fmt(cmd) { document.execCommand(cmd, false, null); }
function fmtBlock(tag) { document.execCommand('formatBlock', false, tag); }

function insertLink() {
  const url = prompt('Nhập URL đường link:');
  if (url) document.execCommand('createLink', false, url);
}

// ── Save article ──────────────────────────────
async function saveArticle(forceStatus) {
  const title    = document.getElementById('title-input').value.trim();
  const slug     = document.getElementById('f-slug').value.trim();
  const bodyHtml = document.getElementById('editor').innerHTML.trim();
  const excerpt  = document.getElementById('f-excerpt').value.trim();

  if (!title) { showToast('Vui lòng nhập tiêu đề', 'error'); return; }
  if (!slug)  { showToast('Vui lòng nhập slug', 'error'); return; }

  // Convert date from YYYY-MM-DD to DD/MM/YYYY
  const rawDate = document.getElementById('f-date').value;
  const dateParts = rawDate.split('-');
  const dateStr = dateParts.length === 3 ? dateParts[2]+'/'+dateParts[1]+'/'+dateParts[0] : rawDate;

  const status = forceStatus || document.getElementById('f-status').value;

  const payload = {
    action:         'save_article',
    password:       _pwd,
    slug,
    title,
    category:       document.getElementById('f-category').value,
    published_date: dateStr,
    author:         document.getElementById('f-author').value || 'OMEGA R&D',
    read_time:      document.getElementById('f-read-time').value || '5 phút',
    excerpt,
    tags:           document.getElementById('f-tags').value,
    is_featured:    document.getElementById('f-featured').checked,
    cover_image:    document.getElementById('f-cover-image').value,
    gallery_images: document.getElementById('f-gallery-images').value,
    doc_id:         document.getElementById('f-doc-id').value,
    seo_title:      document.getElementById('f-seo-title').value || title,
    seo_desc:       document.getElementById('f-seo-desc').value || excerpt,
    body_html:      bodyHtml,
    status,
  };

  const btnId = status === 'draft' ? 'btn-draft' : 'btn-publish';
  const btn = document.getElementById(btnId);
  btn.disabled = true;
  const orig = btn.textContent;
  btn.textContent = '⏳ Đang lưu...';

  try {
    const r = await gasPost(payload);
    if (!r.success) throw new Error(r.error);
    _currentSlug = slug;
    document.getElementById('btn-delete').style.display = '';
    showToast(r.action === 'created' ? '🎉 Đã đăng bài mới!' : '✅ Đã cập nhật bài', 'success');
    _allArticles = []; // reset cache list
  } catch(e) { showToast('Lỗi: ' + e.message, 'error'); }

  btn.disabled = false;
  btn.textContent = orig;
}

// ── Delete article ────────────────────────────
async function deleteArticle() {
  if (!_currentSlug) return;
  if (!confirm('Chuyển bài "' + _currentSlug + '" về trạng thái Nháp?')) return;
  try {
    const r = await gasPost({ action: 'delete_article', password: _pwd, slug: _currentSlug });
    if (!r.success) throw new Error(r.error);
    showToast('Đã chuyển về nháp', 'success');
    newArticle();
  } catch(e) { showToast('Lỗi: ' + e.message, 'error'); }
}

// ── Article list ──────────────────────────────
async function loadArticleList() {
  const container = document.getElementById('article-list');
  if (_allArticles.length === 0) {
    container.innerHTML = '<div style="color:var(--muted);text-align:center;padding:40px;">Đang tải...</div>';
    try {
      const r = await gasGet('action=list&limit=500');
      _allArticles = r.success ? r.data : [];
    } catch(e) {
      container.innerHTML = '<div style="color:var(--red);padding:20px;">Lỗi tải danh sách: ' + e.message + '</div>';
      return;
    }
  }
  filterList();
}

function filterList() {
  const q   = (document.getElementById('list-search').value || '').toLowerCase();
  const cat = document.getElementById('list-cat').value;
  let items = _allArticles.filter(a => {
    const matchQ   = !q || a.title.toLowerCase().includes(q) || a.slug.toLowerCase().includes(q);
    const matchCat = !cat || a.category === cat;
    return matchQ && matchCat;
  });
  document.getElementById('list-count').textContent = items.length + ' bài';
  const container = document.getElementById('article-list');
  if (!items.length) {
    container.innerHTML = '<div style="color:var(--muted);text-align:center;padding:40px;">Không có bài viết</div>';
    return;
  }
  container.innerHTML = items.map(a =>
    `<div class="list-item${a.slug===_currentSlug?' active':''}" onclick="editArticle(${JSON.stringify(a).replace(/"/g,'&quot;')})">
      <div>
        <div class="li-title">${esc(a.title)}</div>
        <div style="font-size:11px;color:var(--muted);">${esc(a.slug)} · ${esc(a.category)}</div>
      </div>
      <div class="li-date">${esc(a.published_date)}</div>
    </div>`
  ).join('');
}

function editArticle(a) {
  _currentSlug = a.slug;
  slugEdited = true;
  document.getElementById('title-input').value = a.title || '';
  document.getElementById('f-slug').value = a.slug || '';
  document.getElementById('f-slug').oninput && (slugEdited = true);
  document.getElementById('f-category').value = a.category || 'chuyen-doi-so';
  document.getElementById('f-author').value = a.author || 'OMEGA R&D';
  document.getElementById('f-read-time').value = a.read_time || '5 phút';
  document.getElementById('f-excerpt').value = a.excerpt || '';
  document.getElementById('f-tags').value = a.tags || '';
  document.getElementById('f-featured').checked = !!a.is_featured;
  document.getElementById('f-seo-title').value = a.seo_title || '';
  document.getElementById('f-seo-desc').value = a.seo_desc || '';
  document.getElementById('f-status').value = a.status || 'published';
  // Gallery
  resetGallery();
  if (a.gallery_images) {
    a.gallery_images.split(',').map(u => u.trim()).filter(Boolean).forEach(addGalleryUrl);
  } else if (a.cover_image) {
    addGalleryUrl(a.cover_image);
  }
  // Doc ID
  const docId = a.doc_id || '';
  document.getElementById('f-doc-id').value = docId;
  document.getElementById('f-doc-id-display').textContent = docId || '—';
  document.getElementById('f-doc-url').value = docId ? 'https://docs.google.com/document/d/' + docId + '/edit' : '';

  document.getElementById('slug-preview').textContent = 'URL: /tin-tuc/' + a.slug + '.html';
  document.getElementById('btn-delete').style.display = '';
  countExcerpt();

  // Convert date DD/MM/YYYY → YYYY-MM-DD
  if (a.published_date) {
    const p = a.published_date.split('/');
    if (p.length === 3) document.getElementById('f-date').value = p[2]+'-'+p[1]+'-'+p[0];
  }

  // Fetch full content
  document.getElementById('editor').innerHTML = '<p style="color:var(--muted);">Đang tải nội dung...</p>';
  switchTab('editor');

  gasGet('action=post&slug=' + encodeURIComponent(a.slug)).then(r => {
    if (r.success && r.data) {
      document.getElementById('editor').innerHTML = r.data.content || r.data.body_html || '';
    }
  }).catch(() => { document.getElementById('editor').innerHTML = ''; });
}

// ── SEO collapsible ───────────────────────────
function toggleSeo() {
  const body   = document.getElementById('seo-body');
  const toggle = document.getElementById('seo-toggle');
  body.classList.toggle('hidden');
  toggle.classList.toggle('open');
}

// ── Char counts ───────────────────────────────
function countExcerpt() {
  const n = document.getElementById('f-excerpt').value.length;
  const el = document.getElementById('excerpt-count');
  el.textContent = n + ' / 200';
  el.classList.toggle('over', n > 200);
}
document.getElementById('f-seo-desc').addEventListener('input', function(){
  const n = this.value.length;
  const el = document.getElementById('seo-desc-count');
  el.textContent = n + ' / 160';
  el.classList.toggle('over', n > 160);
});

// ── Helpers ───────────────────────────────────
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fileToBase64(file) {
  return new Promise((res, rej) => {
    const reader = new FileReader();
    reader.onload = () => res(reader.result.split(',')[1]);
    reader.onerror = rej;
    reader.readAsDataURL(file);
  });
}

async function gasPost(payload) {
  if (!GAS_URL) throw new Error('GAS_URL chưa được cấu hình trong admin.html');
  const r = await fetch(GAS_URL, {
    method:  'POST',
    headers: { 'Content-Type': 'text/plain' },
    body:    JSON.stringify(payload),
  });
  const text = await r.text();
  try { return JSON.parse(text); }
  catch(e) { throw new Error('GAS trả về dữ liệu không hợp lệ: ' + text.slice(0,100)); }
}

function gasGet(params) {
  if (!GAS_URL) return Promise.reject(new Error('GAS_URL chưa được cấu hình'));
  return new Promise((resolve, reject) => {
    const cb = '_gcb' + Date.now();
    const s  = document.createElement('script');
    s.src    = GAS_URL + '?' + params + '&callback=' + cb;
    s.onerror = () => { delete window[cb]; document.head.removeChild(s); reject(new Error('JSONP error')); };
    window[cb] = d => { delete window[cb]; document.head.removeChild(s); resolve(d); };
    document.head.appendChild(s);
  });
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + (type || '');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.className = '', 3000);
}

// ── Keyboard shortcuts ────────────────────────
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    saveArticle();
  }
});
